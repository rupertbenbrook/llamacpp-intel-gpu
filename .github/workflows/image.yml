name: Build and publish Intel SYCL image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly upstream rebuild, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arl-s
            xmx: 'OFF'
            suffix: arl-s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest-${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=weekly-${{ matrix.suffix }},enable=${{ github.event_name == 'schedule' }}
            type=sha,prefix=sha-,suffix=-${{ matrix.suffix }}
            type=ref,event=tag,suffix=-${{ matrix.suffix }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./llamacpp
          file: ./llamacpp/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SYCL_DEVICE_ARCH=${{ matrix.arch }}
            SYCL_SUPPORT_XMX=${{ matrix.xmx }}
          cache-from: type=gha,scope=sycl-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=sycl-${{ matrix.suffix }}

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration and shell syntax
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yml -f compose.ghcr.yml config --quiet
          bash -n llamacpp/entrypoint.sh
      - name: Check OpenCode JSON
        run: python3 -m json.tool opencode.json > /dev/null
